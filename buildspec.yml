version: 0.2

env:
  variables:
    S3_BUCKET: "calc-win-ubu-mac"
    APP_NAME: "calculator"

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - echo "Creating virtual environment..."
      - python -m venv venv
      - . venv/bin/activate
      - apt-get update 
      - apt-get install -y dpkg python3-pip python3-venv build-essential 
      - pip install --upgrade pip
      - pip install pyinstaller
      - echo "Install phase complete."

  build:
    commands:
      - echo "Starting build phase..."

      # Detect platform dynamically
      - |
        UNAME=$(uname)
        echo "uname result: $UNAME"
        case "$UNAME" in
          Darwin)
            PLATFORM="mac"
            ;;
          Linux)
            PLATFORM="linux"
            ;;
          MINGW*|MSYS*|CYGWIN*)
            PLATFORM="windows"
            ;;
          *)
            echo "Unknown platform: $UNAME"
            exit 1
            ;;
        esac
        echo "Detected platform: $PLATFORM"

      # Platform-specific build and S3 upload steps
      - |
        if [ "$PLATFORM" = "windows" ]; then
          pyinstaller --onefile --noconsole calculator.py
          aws s3 cp dist/calculator.exe s3://$S3_BUCKET/builds/windows/

        elif [ "$PLATFORM" = "linux" ]; then
          pyinstaller --onefile --noconsole calculator.py
          chmod +x calculator.py
          mkdir -p calculator_deb/DEBIAN
          mkdir -p calculator_deb/usr/local/bin
          cp dist/calculator calculator_deb/usr/local/bin/

          echo "Package: calculator" > calculator_deb/DEBIAN/control
          echo "Version: 1.0" >> calculator_deb/DEBIAN/control
          echo "Section: base" >> calculator_deb/DEBIAN/control
          echo "Priority: optional" >> calculator_deb/DEBIAN/control
          echo "Architecture: amd64" >> calculator_deb/DEBIAN/control
          echo "Depends: python3" >> calculator_deb/DEBIAN/control
          echo "Maintainer: Tejvir Singh <tejvirs548@gmail.com>" >> calculator_deb/DEBIAN/control
          echo "Description: A simple, fully functional calculator built using Python and Tkinter." >> calculator_deb/DEBIAN/control

          chmod 0755 -R calculator_deb/DEBIAN
          dpkg-deb --build calculator_deb

          aws s3 cp calculator_deb.deb s3://$S3_BUCKET/builds/linux/

        elif [ "$PLATFORM" = "mac" ]; then
          pyinstaller --onefile --windowed --name Calculator calculator.py
          aws s3 cp dist/Calculator s3://$S3_BUCKET/builds/mac/
        fi

artifacts:
  files:
    - dist/**
    - calculator_deb.deb
  discard-paths: yes

